      <path d="M586 344 C610 336 620 358 614 388 C608 418 592 434 576 428" stroke="#6b6050" stroke-width="6" fill="none" opacity=".52"/>
      <path d="M560 326 C550 368 550 422 564 462" stroke="#1d1a16" stroke-width="17" fill="none" opacity=".4" filter="url(#b9)"/>
    </g>

    <!-- EYE: only a shadow hollow under the brim, and one thread of red -->
