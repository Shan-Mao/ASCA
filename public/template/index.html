<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9f4">
  <meta name="description" content="情景模板：复制本目录即可开始一个新的情景、小游戏或小工具。">
  <title>情景模板 — ASCA</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="scene">
    <p class="eyebrow" data-eyebrow>SCENE TEMPLATE</p>
    <h1 data-title>把这里换成一个新的情景。</h1>
    <p class="lede" data-lede>
      这个目录是一个自包含的最小骨架：一个 HTML、一个 CSS、一个 JS，加上自己的 media 文件夹。
      复制整个目录改名，就能得到一个互不影响的新项目。
    </p>
    <div class="row">
      <button class="btn" type="button" data-demo>试试交互</button>
      <a class="link" href="../../">← 返回索引</a>
    </div>
    <p class="state" data-state>就绪</p>
  </main>
</body>
</html>
