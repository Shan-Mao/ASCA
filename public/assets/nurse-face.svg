      <stop offset=".38" stop-color="#a24135" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7d2b24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowBig" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0f0e0c" stop-opacity=".68"/>
      <stop offset=".55" stop-color="#121110" stop-opacity=".36"/>
      <stop offset="1" stop-color="#141312" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neckFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141312" stop-opacity="0"/>
      <stop offset=".35" stop-color="#141312" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#141312" stop-opacity=".92"/>
      <stop offset="1" stop-color="#141312" stop-opacity="1"/>
    </linearGradient>
    <filter id="b2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="b4" x="-24%" y="-24%" width="148%" height="148%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b9" x="-28%" y="-28%" width="156%" height="156%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="b18" x="-34%" y="-34%" width="168%" height="168%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="b34" x="-42%" y="-42%" width="184%" height="184%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="b60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="weave" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".022 .07" numOctaves="3" seed="43" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="c">
        <feFuncR type="linear" slope=".22" intercept=".62"/>
        <feFuncG type="linear" slope=".22" intercept=".62"/>
        <feFuncB type="linear" slope=".22" intercept=".62"/>
        <feFuncA type="linear" slope=".45"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="c" mode="multiply" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="2" seed="53" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="c"><feFuncA type="linear" slope=".075"/></feComponentTransfer>
    </filter>

    <clipPath id="clipHead">
      <path d="M452 110 C356 110 298 182 294 292 C291 386 310 458 344 510 C378 560 422 584 450 584 C478 584 516 560 544 512 C574 462 586 388 580 300 C572 190 538 110 452 110 Z"/>
    </clipPath>
    <clipPath id="clipMask">
