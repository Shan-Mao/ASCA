<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000" role="img" aria-labelledby="nfTitle nfDesc">
  <title id="nfTitle">夜班护士 · 贴脸近景</title>
  <desc id="nfDesc">原创低光护士头胸近景：旧纱布与褶皱口罩遮住大半张脸，只剩一侧深陷的眼窝与极小反光，帽檐下没有完整表情。</desc>

  <defs>
    <linearGradient id="bg" x1=".22" y1="0" x2=".84" y2="1">
      <stop offset="0" stop-color="#9c9487"/>
      <stop offset=".18" stop-color="#736c60"/>
      <stop offset=".4" stop-color="#474136"/>
      <stop offset=".62" stop-color="#282521"/>
      <stop offset=".84" stop-color="#171513"/>
      <stop offset="1" stop-color="#111010"/>
    </linearGradient>
    <radialGradient id="keyL" cx=".24" cy=".18" r=".6">
      <stop offset="0" stop-color="#fff8ea" stop-opacity=".13"/>
      <stop offset=".48" stop-color="#efe6d4" stop-opacity=".03"/>
      <stop offset="1" stop-color="#efe6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".44" cy=".4" r=".86">
      <stop offset="0" stop-color="#141312" stop-opacity="0"/>
      <stop offset=".4" stop-color="#141312" stop-opacity=".04"/>
      <stop offset=".7" stop-color="#141312" stop-opacity=".36"/>
      <stop offset="1" stop-color="#141312" stop-opacity=".95"/>
    </radialGradient>

    <linearGradient id="skinG" x1=".18" y1=".06" x2=".86" y2=".9">
      <stop offset="0" stop-color="#ebe0ca"/>
      <stop offset=".24" stop-color="#ddd0ba"/>
      <stop offset=".46" stop-color="#c5b8a2"/>
      <stop offset=".66" stop-color="#9b8f79"/>
      <stop offset=".84" stop-color="#5d5448"/>
      <stop offset="1" stop-color="#2a2620"/>
    </linearGradient>
    <linearGradient id="capG" x1=".08" y1="0" x2=".94" y2="1">
      <stop offset="0" stop-color="#fdfaf1"/>
      <stop offset=".24" stop-color="#f6f0e3"/>
      <stop offset=".5" stop-color="#ddd5c4"/>
      <stop offset=".74" stop-color="#a9a090"/>
      <stop offset=".92" stop-color="#6e6659"/>
      <stop offset="1" stop-color="#463f36"/>
    </linearGradient>
    <linearGradient id="maskG" x1=".06" y1=".04" x2=".94" y2=".96">
      <stop offset="0" stop-color="#f7f1e4"/>
      <stop offset=".22" stop-color="#eae2d2"/>
      <stop offset=".48" stop-color="#cfc6b5"/>
      <stop offset=".72" stop-color="#a19687"/>
      <stop offset=".9" stop-color="#5a5247"/>
      <stop offset="1" stop-color="#322d28"/>
    </linearGradient>
    <linearGradient id="collarG" x1=".2" y1="0" x2=".78" y2="1">
      <stop offset="0" stop-color="#d9d2c3"/>
      <stop offset=".28" stop-color="#b7af9f"/>
      <stop offset=".58" stop-color="#726a5d"/>
      <stop offset=".82" stop-color="#37332d"/>
      <stop offset="1" stop-color="#1b1916"/>
    </linearGradient>
    <linearGradient id="redG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f3d2f"/>
      <stop offset=".5" stop-color="#7d2b24"/>
      <stop offset="1" stop-color="#390f0b"/>
    </linearGradient>
    <radialGradient id="sparkG" cx=".5" cy=".5" r=".5">
