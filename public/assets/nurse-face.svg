      <ellipse cx="424" cy="384" rx="120" ry="70" fill="#0c0a08" opacity=".38" filter="url(#b34)" transform="rotate(-5 424 384)"/>
      <ellipse cx="420" cy="386" rx="86" ry="34" fill="#100d0a" opacity=".34" filter="url(#b18)" transform="rotate(-4 420 386)"/>
