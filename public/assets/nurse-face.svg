    <path d="M452 110 C356 110 298 182 294 292 C291 386 310 458 344 510 C378 560 422 584 450 584 C478 584 516 560 544 512 C574 462 586 388 580 300 C572 190 538 110 452 110 Z" fill="url(#skinG)"/>

