<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="wardTitle wardDesc">
  <title id="wardTitle">私立疗养院夜班长廊</title>
  <desc id="wardDesc">原创夜景：暖白灰墙与木质门，暗红护士呼叫灯在门侧微亮，廊中段有观察窗与远处病床，地面湿亮反光、薄雾，尽头走廊中心立着一个护士剪影；强电影透视与暗角，全图只用暖白、骨色、炭黑、暗红，无绿色。</desc>

  <defs>
    <!-- vanishing point at 800,470 -->
    <linearGradient id="wAir" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141312"/>
      <stop offset=".32" stop-color="#2a2622"/>
      <stop offset=".62" stop-color="#4a443c"/>
      <stop offset=".86" stop-color="#6d665a"/>
      <stop offset="1" stop-color="#191715"/>
    </linearGradient>

    <linearGradient id="wWallSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141312"/>
      <stop offset=".35" stop-color="#4d473e"/>
      <stop offset=".72" stop-color="#9a9081"/>
      <stop offset="1" stop-color="#cfc5b3"/>
    </linearGradient>
    <linearGradient id="wWallRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#141312"/>
      <stop offset=".4" stop-color="#443e37"/>
      <stop offset=".78" stop-color="#8c8273"/>
      <stop offset="1" stop-color="#c2b8a6"/>
    </linearGradient>

    <linearGradient id="wFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5349"/>
      <stop offset=".35" stop-color="#3b3731"/>
      <stop offset=".72" stop-color="#23211d"/>
      <stop offset="1" stop-color="#100f0e"/>
    </linearGradient>
    <linearGradient id="wCeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0e0d"/>
      <stop offset=".6" stop-color="#26231f"/>
      <stop offset="1" stop-color="#3c3832"/>
    </linearGradient>

    <linearGradient id="wDoor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a211a"/>
      <stop offset=".45" stop-color="#4e3d2f"/>
      <stop offset=".8" stop-color="#6b5540"/>
      <stop offset="1" stop-color="#3c2e23"/>
    </linearGradient>
    <linearGradient id="wDoorDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1512"/>
      <stop offset=".5" stop-color="#33271e"/>
      <stop offset="1" stop-color="#211a15"/>
    </linearGradient>

    <radialGradient id="wCall" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d0675a" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#a8412f" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#7d2b24" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7d2b24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wFarGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6e4" stop-opacity=".62"/>
      <stop offset=".34" stop-color="#e8dcc4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#e8e3d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wObsLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3da" stop-opacity=".7"/>
      <stop offset=".55" stop-color="#cbbfa6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#3a332a" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="wWet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ecd8" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#b9ae99" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b9ae99" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="wVig" cx=".5" cy=".47" r=".72">
      <stop offset="0" stop-color="#141312" stop-opacity="0"/>
      <stop offset=".5" stop-color="#141312" stop-opacity=".12"/>
      <stop offset=".78" stop-color="#141312" stop-opacity=".52"/>
      <stop offset="1" stop-color="#141312" stop-opacity=".92"/>
    </radialGradient>

    <filter id="wBlur1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="wBlur2" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="wBlur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="wBlur4" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="wGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="5" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="c"><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    </filter>
    <filter id="wFog" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .02" numOctaves="3" seed="23" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="c">
        <feFuncA type="table" tableValues="0 .38"/>
      </feComponentTransfer>
      <feGaussianBlur in="c" stdDeviation="12"/>
    </filter>

    <clipPath id="wFloorClip">
      <path d="M0 1000 L1600 1000 L800 470 Z"/>
    </clipPath>
  </defs>

  <!-- base night air -->
  <rect width="1600" height="1000" fill="url(#wAir)"/>
  <rect width="1600" height="1000" fill="#141312" opacity=".35"/>

  <!-- ceiling -->
  <path d="M0 0 L1600 0 L800 470 Z" fill="url(#wCeil)"/>
  <g stroke="#141312" stroke-width="2" opacity=".5">
    <path d="M240 0 L800 470"/>
    <path d="M560 0 L800 470"/>
    <path d="M1040 0 L800 470"/>
    <path d="M1360 0 L800 470"/>
  </g>
  <g stroke="#6a6358" stroke-width="1.2" opacity=".16">
    <path d="M240 0 L800 470"/>
    <path d="M1360 0 L800 470"/>
  </g>

  <!-- LEFT WALL -->
  <path d="M0 0 L800 470 L800 520 L0 1000 Z" fill="url(#wWallSide)"/>
  <g>
    <!-- wainscot rail -->
    <path d="M0 640 L800 512 L800 524 L0 660 Z" fill="#6f6659" opacity=".8"/>
    <path d="M0 660 L800 524 L800 1000 L0 1000 Z" fill="#141312" opacity=".32"/>

    <!-- near door -->
    <g>
      <path d="M60 640 L150 592 L150 1000 L60 1000 Z" fill="url(#wDoor)"/>
      <path d="M150 592 L156 590 L156 1000 L150 1000 Z" fill="#1b1511"/>
      <path d="M74 690 L140 654 L140 826 L74 852 Z" fill="#3a2d23" opacity=".85"/>
      <path d="M74 868 L140 838 L140 968 L74 992 Z" fill="#33271e" opacity=".9"/>
      <rect x="62" y="880" width="7" height="26" rx="3" fill="#9a8f7d" opacity=".55"/>
      <path d="M66 604 L146 562 L146 590 L66 630 Z" fill="#7d7365" opacity=".45"/>
    </g>
    <!-- mid door -->
    <g>
      <path d="M250 566 L300 540 L300 700 L250 712 Z" fill="url(#wDoorDark)"/>
      <path d="M262 578 L292 562 L292 640 L262 652 Z" fill="#4a3a2c" opacity=".8"/>
      <rect x="252" y="664" width="4" height="14" rx="2" fill="#8d8272" opacity=".45"/>
    </g>
    <!-- far door -->
    <g>
      <path d="M380 508 L406 496 L406 556 L380 562 Z" fill="#241c16"/>
      <rect x="382" y="524" width="3" height="9" rx="1" fill="#7d7365" opacity=".4"/>
    </g>

    <!-- sconce: one weak warm source -->
    <g>
      <ellipse cx="196" cy="522" rx="46" ry="60" fill="#f3e7cf" opacity=".16" filter="url(#wBlur3)"/>
      <path d="M196 512 c6 0 10 5 10 11 c0 7 -5 12 -10 12 c-5 0 -10 -5 -10 -12 c0 -6 4 -11 10 -11 Z" fill="#efe2c6" opacity=".55"/>
      <ellipse cx="196" cy="524" rx="5" ry="6" fill="#fff6e2" opacity=".8"/>
    </g>

    <!-- call light, dark red -->
    <g>
      <ellipse cx="176" cy="742" rx="52" ry="56" fill="url(#wCall)" opacity=".7"/>
      <rect x="168" y="734" width="17" height="17" rx="3" fill="#5a1f19" stroke="#a34a3e" stroke-width="1.6"/>
      <ellipse cx="176.5" cy="742.5" rx="4" ry="4" fill="#e08374" opacity=".9"/>
      <path d="M176 751 L176 800" stroke="#7d2b24" stroke-width="2" opacity=".45"/>
    </g>
    <g>
      <ellipse cx="322" cy="626" rx="26" ry="28" fill="url(#wCall)" opacity=".55"/>
      <rect x="317" y="620" width="11" height="11" rx="2" fill="#48170f" stroke="#8f3b30" stroke-width="1.2"/>
      <ellipse cx="322.5" cy="625.5" rx="2.6" ry="2.6" fill="#d07c6d" opacity=".85"/>
    </g>
    <!-- near call light, cropped by the frame -->
    <g>
      <ellipse cx="18" cy="836" rx="70" ry="72" fill="url(#wCall)" opacity=".55"/>
      <rect x="8" y="826" width="22" height="22" rx="3" fill="#54190f" stroke="#b05a4c" stroke-width="1.8"/>
      <ellipse cx="19" cy="837" rx="5" ry="5" fill="#e89b8a" opacity=".8"/>
    </g>

    <path d="M0 700 L800 526" stroke="#3a342d" stroke-width="2" opacity=".5"/>
    <path d="M0 946 L800 536" stroke="#221f1a" stroke-width="4" opacity=".55"/>
  </g>

  <!-- RIGHT WALL -->
  <path d="M1600 0 L800 470 L800 520 L1600 1000 Z" fill="url(#wWallRight)"/>
  <g>
    <path d="M1600 0 L800 470 L800 520 L1600 1000 Z" fill="#141312" opacity=".34"/>
    <path d="M1600 660 L800 512 L800 524 L1600 680 Z" fill="#5f574c" opacity=".55"/>
    <path d="M1600 680 L800 524 L800 1000 L1600 1000 Z" fill="#141312" opacity=".3"/>

    <!-- observation window into a dim side ward -->
    <g>
      <path d="M1080 566 L1204 588 L1204 456 L1080 420 Z" fill="#241f1a"/>
      <!-- glass: weak, uneven interior light -->
      <path d="M1090 560 L1196 580 L1196 464 L1090 432 Z" fill="#5b5346"/>
      <path d="M1090 560 L1196 580 L1196 464 L1090 432 Z" fill="url(#wObsLight)" opacity=".34"/>
      <!-- room inside: back wall, floor line, a bed and a rail -->
      <g opacity=".8">
        <path d="M1094 500 L1192 516 L1192 540 L1094 524 Z" fill="#3a332b"/>
        <path d="M1094 524 L1192 540 L1192 570 L1094 556 Z" fill="#2a251f"/>
        <path d="M1102 528 L1170 538 L1170 520 L1102 510 Z" fill="#bdb29c" opacity=".72"/>
        <path d="M1102 528 L1170 538 L1170 546 L1102 536 Z" fill="#6d6557" opacity=".8"/>
        <path d="M1106 512 C1124 505 1148 508 1160 516" stroke="#8f8574" stroke-width="3" fill="none" opacity=".7"/>
        <path d="M1176 522 L1180 548" stroke="#3f3931" stroke-width="3"/>
      </g>
      <!-- cold interior light spill on the bed head only -->
      <ellipse cx="1128" cy="516" rx="42" ry="22" fill="#e8dcc2" opacity=".14" filter="url(#wBlur3)"/>
      <!-- mullions and frame -->
      <path d="M1145 440 L1145 572" stroke="#2e2a24" stroke-width="5"/>
      <path d="M1082 494 L1200 512" stroke="#2e2a24" stroke-width="4"/>
      <path d="M1080 420 L1204 456" stroke="#8f8471" stroke-width="2" opacity=".34"/>
      <path d="M1080 566 L1204 588" stroke="#6d6558" stroke-width="3" opacity=".4"/>
      <!-- glass reflection streak -->
      <path d="M1096 472 L1120 476 L1120 520 L1096 514 Z" fill="#efe6d4" opacity=".07"/>
      <ellipse cx="1140" cy="520" rx="120" ry="90" fill="#fff2d8" opacity=".055" filter="url(#wBlur3)"/>
    </g>

    <!-- near door -->
    <g>
      <path d="M1420 700 L1540 642 L1540 1000 L1420 1000 Z" fill="url(#wDoorDark)"/>
      <path d="M1540 642 L1548 638 L1548 1000 L1540 1000 Z" fill="#161210"/>
      <path d="M1440 736 L1520 698 L1520 862 L1440 890 Z" fill="#382b21" opacity=".8"/>
      <rect x="1428" y="884" width="8" height="28" rx="4" fill="#8b806e" opacity=".45"/>
    </g>
    <g>
      <ellipse cx="1352" cy="742" rx="40" ry="44" fill="url(#wCall)" opacity=".5"/>
      <rect x="1345" y="735" width="14" height="14" rx="2" fill="#4b180f" stroke="#8f3b30" stroke-width="1.4"/>
      <ellipse cx="1352" cy="742" rx="3.4" ry="3.4" fill="#cf7a6b" opacity=".85"/>
    </g>
    <g>
      <path d="M880 524 L906 516 L906 604 L880 610 Z" fill="#231b16"/>
    </g>
    <path d="M1600 724 L800 530" stroke="#2c2822" stroke-width="3" opacity=".5"/>
    <path d="M1600 960 L800 540" stroke="#1c1915" stroke-width="5" opacity=".6"/>
  </g>

  <!-- FAR END: cross wall, lit ward bay, distant bed -->
  <g>
    <path d="M672 424 L928 424 L928 556 L672 556 Z" fill="#3a352e"/>
    <path d="M688 438 L912 438 L912 540 L688 540 Z" fill="#5b5348"/>
    <path d="M700 446 L900 446 L900 532 L700 532 Z" fill="#8e8474"/>
    <path d="M700 446 L900 446 L900 532 L700 532 Z" fill="url(#wObsLight)" opacity=".8"/>
    <g opacity=".62">
      <path d="M716 506 L812 502 L818 516 L712 520 Z" fill="#d6ccb8"/>
      <path d="M712 520 L818 516 L818 526 L712 530 Z" fill="#6f6659"/>
      <path d="M720 496 C736 488 764 488 782 496" stroke="#b6aa94" stroke-width="4" fill="none"/>
      <path d="M824 500 L830 528" stroke="#4e4840" stroke-width="3"/>
    </g>
    <rect x="744" y="452" width="120" height="4" rx="2" fill="#fff3d8" opacity=".55"/>
    <ellipse cx="800" cy="486" rx="150" ry="90" fill="url(#wFarGlow)" opacity=".6"/>
    <path d="M800 438 L800 540" stroke="#2b2723" stroke-width="5"/>
    <path d="M688 486 L912 486" stroke="#2b2723" stroke-width="4"/>
    <path d="M688 438 L912 438" stroke="#8e8474" stroke-width="2" opacity=".4"/>
  </g>

  <!-- doorway at the very end of the hall: rectangular, receding -->
  <path d="M714 470 L886 470 L886 566 L714 566 Z" fill="#191715"/>
  <path d="M714 470 L886 470 L886 566 L714 566 Z" fill="none" stroke="#6f6659" stroke-width="2" opacity=".18"/>
  <!-- door frame posts, giving the far end depth -->
  <path d="M700 566 L700 466 L714 466 L714 570 Z" fill="#2a2620" opacity=".8"/>
  <path d="M886 466 L900 466 L900 570 L886 570 Z" fill="#221f1a" opacity=".8"/>

  <!-- FLOOR -->
  <path d="M0 1000 L800 470 L1600 1000 Z" fill="url(#wFloor)"/>
  <g clip-path="url(#wFloorClip)">
    <g stroke="#6d6559" stroke-width="1.4" opacity=".22">
      <path d="M0 1000 L800 470"/>
      <path d="M170 1000 L800 470"/>
      <path d="M330 1000 L800 470"/>
      <path d="M470 1000 L800 470"/>
      <path d="M610 1000 L800 470"/>
      <path d="M990 1000 L800 470"/>
      <path d="M1130 1000 L800 470"/>
      <path d="M1270 1000 L800 470"/>
      <path d="M1430 1000 L800 470"/>
      <path d="M1600 1000 L800 470"/>
    </g>
    <g stroke="#0f0e0d" stroke-width="2" opacity=".4">
      <path d="M0 742 L1600 742"/>
      <path d="M60 828 L1540 828"/>
      <path d="M190 906 L1410 906"/>
      <path d="M330 962 L1270 962"/>
    </g>
    <!-- wet sheen: long vertical smears under the far light -->
    <g filter="url(#wBlur2)" opacity=".55">
      <path d="M770 528 L830 528 L880 1000 L720 1000 Z" fill="url(#wWet)"/>
      <path d="M700 560 L740 560 L690 1000 L600 1000 Z" fill="#e6dac2" opacity=".12"/>
      <path d="M860 560 L900 560 L1000 1000 L910 1000 Z" fill="#e6dac2" opacity=".1"/>
    </g>
    <g opacity=".5" filter="url(#wBlur2)">
      <ellipse cx="800" cy="596" rx="52" ry="16" fill="#fdf1d6" opacity=".3"/>
      <path d="M770 540 L830 540 L846 700 L754 700 Z" fill="#e8dcc2" opacity=".07"/>
      <ellipse cx="620" cy="700" rx="44" ry="16" fill="#e9dbc0" opacity=".28"/>
      <ellipse cx="1010" cy="712" rx="52" ry="18" fill="#e0d2b8" opacity=".24"/>
      <ellipse cx="420" cy="820" rx="70" ry="22" fill="#cfc2a8" opacity=".16"/>
      <ellipse cx="1210" cy="842" rx="84" ry="24" fill="#c6b9a0" opacity=".14"/>
    </g>
    <g filter="url(#wBlur2)" opacity=".55">
      <ellipse cx="186" cy="900" rx="26" ry="90" fill="#7d2b24" opacity=".5"/>
      <ellipse cx="330" cy="712" rx="12" ry="44" fill="#7d2b24" opacity=".38"/>
      <ellipse cx="1348" cy="900" rx="22" ry="70" fill="#7d2b24" opacity=".38"/>
    </g>
    <g filter="url(#wBlur2)" opacity=".32">
      <path d="M1096 616 L1206 636 L1200 706 L1094 686 Z" fill="#f3e6cb"/>
    </g>
    <g filter="url(#wBlur1)" opacity=".6">
      <ellipse cx="700" cy="884" rx="140" ry="34" fill="#141312" opacity=".75"/>
      <ellipse cx="980" cy="934" rx="120" ry="30" fill="#141312" opacity=".6"/>
    </g>
  </g>
  <path d="M0 990 L800 520" stroke="#f0e5cd" stroke-width="2" opacity=".1" filter="url(#wBlur1)"/>
  <path d="M1600 990 L800 520" stroke="#f0e5cd" stroke-width="2" opacity=".08" filter="url(#wBlur1)"/>

  <!-- FIGURE: small, upright nurse silhouette deep down the hall -->
  <g>
    <ellipse cx="800" cy="486" rx="66" ry="56" fill="#e8dcc2" opacity=".13" filter="url(#wBlur4)"/>
    <ellipse cx="800" cy="528" rx="19" ry="3.6" fill="#141312" opacity=".7"/>
    <!-- mirrored smudge on the wet floor -->
    <path d="M791 530 C787 566 784 602 783 630 L817 630 C816 602 813 566 809 530 Z" fill="#141312" opacity=".16" filter="url(#wBlur3)"/>

    <g fill="#141312">
      <!-- skirt: straight, floor length, hem cut by perspective -->
      <path d="M790 468 C787 482 785 500 784 518 C783 538 784 556 786 570 C783 590 780 612 778 630 L822 630 C820 612 817 590 814 570 C816 556 817 538 816 518 C815 500 813 482 810 468 Z"/>
      <!-- torso -->
      <path d="M800 434 C794 435 789 441 787 452 C785 462 784 472 785 482 L815 482 C816 472 815 462 813 452 C811 441 806 435 800 434 Z"/>
      <!-- arms, long, close to the body -->
      <path d="M787 446 C783 456 781 470 780 484 C779 500 780 514 781 526 L787 526 C786 514 785 500 786 486 C787 472 789 458 792 449 Z"/>
      <path d="M813 449 C816 458 818 472 819 486 C820 500 819 514 818 526 L812 526 C813 514 814 500 813 486 C812 472 810 458 807 447 Z"/>
      <!-- head and cap -->
      <path d="M800 408 C795 409 792 414 792 421 C792 428 796 434 800 436 C804 437 809 432 810 424 C811 415 807 408 803 407 Z"/>
      <path d="M789 421 C787 414 792 407 800 406 C808 405 814 410 815 417 C816 422 813 425 809 426 C803 428 792 427 789 421 Z"/>
    </g>

    <!-- two faint catches of light, and one red point at the face -->
    <g>
      <path d="M781 486 C780 500 780 514 781 526" stroke="#cfc5b2" stroke-width="1.1" fill="none" opacity=".24"/>
      <path d="M787 480 C786 496 786 512 787 526" stroke="#7d2b24" stroke-width="1" fill="none" opacity=".45"/>
      <rect x="793" y="456" width="4" height="3" rx="1" fill="#7d2b24" opacity=".5"/>
      <ellipse cx="800" cy="421" rx="1.8" ry="1.2" fill="#7d2b24" opacity=".55"/>
      <ellipse cx="800" cy="421" rx="5" ry="3.6" fill="#7d2b24" opacity=".16" filter="url(#wBlur1)"/>
    </g>
  </g>

  <!-- mist, middle distance only -->
  <g opacity=".42">
    <rect x="0" y="470" width="1600" height="250" filter="url(#wFog)" opacity=".7"/>
    <ellipse cx="800" cy="556" rx="430" ry="96" fill="#e3d5bd" opacity=".09" filter="url(#wBlur4)"/>
    <ellipse cx="430" cy="628" rx="330" ry="72" fill="#d6c7ad" opacity=".055" filter="url(#wBlur4)"/>
    <ellipse cx="1190" cy="646" rx="310" ry="70" fill="#d6c7ad" opacity=".05" filter="url(#wBlur4)"/>
  </g>

  <ellipse cx="800" cy="480" rx="260" ry="180" fill="url(#wFarGlow)" opacity=".35"/>

  <path d="M0 0 L1600 0 L1600 190 C1200 120 400 120 0 190 Z" fill="#141312" opacity=".55"/>
  <path d="M0 1000 L1600 1000 L1600 900 C1200 940 400 940 0 900 Z" fill="#141312" opacity=".5"/>
  <rect width="1600" height="1000" fill="url(#wVig)"/>
  <rect width="1600" height="1000" filter="url(#wGrain)" opacity=".5"/>
</svg>
