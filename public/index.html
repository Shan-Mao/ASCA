<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9f4">
  <meta name="description" content="ASCA 作品集：情景体验、小游戏与小工具。">
  <title>ASCA — 情景 · 小游戏 · 小工具</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <span class="logo">ASCA</span>
      <span class="tag">情景体验 / 小游戏 / 小工具</span>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <p class="eye">A SMALL COLLECTION</p>
      <h1>每一个页面，<br>都是一件单独的<span>小东西</span>。</h1>
      <p class="lede">这里放我做过的情景体验、小游戏和小工具。每一个都放在自己的文件夹里，互不依赖，可以单独打开，也可以单独搬走。</p>
    </section>

    <section aria-labelledby="scenes-title">
      <div class="sec-head">
        <h2 id="scenes-title">情景体验</h2>
        <span class="count" id="scene-count">1 个</span>
      </div>
      <div class="grid" id="scene-grid">
        <a class="card" href="./scenes/care-home/">
          <div class="card-art art-care"></div>
          <div class="card-body">
            <div class="card-meta"><span class="pill">滚动叙事</span><span class="num">01</span></div>
            <h3>梅麓疗养院</h3>
            <p>一家园林式疗养院，从明亮的花园开始，越往下越不对劲。</p>
            <span class="go">进入 →</span>
          </div>
        </a>
      </div>
    </section>

    <section aria-labelledby="more-title">
      <div class="sec-head">
        <h2 id="more-title">小游戏 / 小工具</h2>
        <span class="count">待添加</span>
      </div>
      <div class="empty">
        <p>还没有添加。新内容会放进各自的文件夹，再在这里列一行。</p>
        <code>public/scenes/&lt;名称&gt;/index.html</code>
      </div>
    </section>
  </main>

  <footer class="wrap foot">
    <span>ASCA · 本地项目</span>
    <span>每个情景独立目录，互不影响</span>
  </footer>
</body>
</html>
